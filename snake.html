<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jogo da Cobra</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="game-container">
        <h1>🐍 Sonserina - Jogo da Cobra</h1>
        <div class="score-board">
            <div class="score-item">Pontuação: <span id="score">0</span></div>
            <div class="score-item">Recorde: <span id="highScore">0</span></div>
        </div>
        <canvas id="gameCanvas" width="600" height="600"></canvas>
        <div class="controls">
            Use as setas do teclado para controlar a cobra
        </div>
    </div>

    <div class="game-over" id="gameOver">
        <h2>Game Over!</h2>
        <p id="gameOverMessage">O jogo terminou!</p>
        <p>Pontuação Final: <span id="finalScore">0</span></p>
        <button onclick="restartGame()">Jogar Novamente</button>
    </div>

    <script src="script.js"></script>
</body>
</html>
